<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Roseln Dorf: alle Personen des Roselner Kirchenbuchs, mit dem Magareier Kirchenbuch und Christian Weiss’ Dorfgeschichte.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roseln Dorf">
<meta name="theme-color" content="#f6f2e9">
<script>
/* language: the splash screen remembers English or German (localStorage), or for this visit only (sessionStorage) */
window.RLANG = {
  get() { try { return localStorage.getItem('roselnv-lang') || sessionStorage.getItem('roselnv-lang'); } catch (e) { return null; } },
  set(l, keep) { try { if (keep) localStorage.setItem('roselnv-lang', l); else { localStorage.removeItem('roselnv-lang'); sessionStorage.setItem('roselnv-lang', l); } } catch (e) { } },
  kept() { try { return !!localStorage.getItem('roselnv-lang'); } catch (e) { return false; } }
};

document.addEventListener('click', e => { const a = e.target.closest('[data-lang]'); if (a) RLANG.set(a.dataset.lang, RLANG.kept()); });
</script>
<link rel="manifest" href="manifest-de.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Roseln Dorf</title>
<style>
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ebgaramond-Regular.woff) format('woff')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400 500;font-display:swap;src:url(fonts/ebgaramond-Italic.woff) format('woff')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ebgaramond-Medium.woff) format('woff')}
@font-face{font-family:'EB Garamond';font-style:normal;font-weight:600 700;font-display:swap;src:url(fonts/ebgaramond-SemiBold.woff) format('woff')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:600 700;font-display:swap;src:url(fonts/ebgaramond-SemiBoldItalic.woff) format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-Regular.woff) format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-Medium.woff) format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-SemiBold.woff) format('woff')}
@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-Bold.woff) format('woff')}
</style>
<style>
:root{
  --paper:#faf7f1;--card:#fffdf8;--ink:#2c2620;--soft:#6b6255;--faint:#9a917f;--line:#e2d9c6;--line2:#efe8d9;
  --accent:#1c3868;--accent2:#2a5294;--accent-soft:rgba(28,56,104,.08);
  --fa:#1f78b4;--mo:#d4891a;
  --t-ch:#1c3868;--b-ch:#e2ecea;--t-we:#94581a;--b-we:#f5e9d6;--t-mg:#6c3d6c;--b-mg:#f1e6f0;--t-gd:#45557a;--b-gd:#e7ebf3;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --tabh:62px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--ui);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--accent2)}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- layout ---------- */
#app{min-height:100%}
.pane{padding:0 0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
@media (min-width:1000px){
  #app{display:grid;grid-template-columns:400px 1fr;height:100vh}
  #find{border-right:1px solid var(--line);overflow-y:auto;height:100vh;padding-bottom:30px}
  #main{overflow-y:auto;height:100vh;padding-bottom:40px}
  #tabbar{display:none}
  body[data-route=find] #main > .welcome{display:block}
  .topnav{display:flex!important}
}
@media (max-width:999.98px){
  body:not([data-route=find]) #find{display:none}
  body[data-route=find] #main{display:none}
}
.welcome{display:none}

/* ---------- tab bar (phones) ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(60,50,30,.06)}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px var(--ui);color:var(--faint);text-decoration:none;max-width:90px}
#tabbar a[aria-current=page]{color:var(--accent)}
#tabbar svg,.ico{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topnav{display:none;gap:4px;padding:10px 16px 0;justify-content:flex-end}
.topnav a{font:600 12.5px var(--ui);color:var(--soft);text-decoration:none;padding:6px 10px;border-radius:8px}
.topnav a[aria-current=page]{color:var(--accent);background:var(--accent-soft)}

/* ---------- common ---------- */
.eyebrow{font:700 11px var(--ui);letter-spacing:.14em;color:var(--accent2);text-transform:uppercase}
h1{font:600 28px/1.15 var(--serif);margin:6px 0 4px;letter-spacing:-.01em}
h2{font:600 22px/1.15 var(--serif);margin:0}
.sub{color:var(--soft);font-size:13.5px}
.tag{display:inline-flex;align-items:center;font:600 10.5px var(--ui);padding:2px 7px;border-radius:20px;white-space:nowrap;letter-spacing:.01em}
.tag.ch{color:var(--t-ch);background:var(--b-ch)}.tag.we{color:var(--t-we);background:var(--b-we)}.tag.mg{color:var(--t-mg);background:var(--b-mg)}.tag.gd{color:var(--t-gd);background:var(--b-gd)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:#ece5d5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);color:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px var(--ui);padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.lbl{font:700 10.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lbl span{letter-spacing:0;text-transform:none;font-weight:500;color:var(--accent2);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--soft)}
.w{font-style:italic;font-family:var(--serif)}
.src{color:var(--soft);font-size:12px}
.src i{font-family:var(--serif)}
.empty{color:var(--soft);font-style:italic;padding:14px 4px}
.lnk{color:var(--accent2);font-weight:600;text-decoration:underline;text-decoration-color:rgba(42,82,148,.35);text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--ui);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
details>summary{cursor:pointer}
.orig summary{font:600 12px var(--ui);color:var(--accent2);list-style:none;margin-top:5px}
.orig summary::-webkit-details-marker{display:none}
.orig summary:after{content:" ▸"}
.orig[open] summary:after{content:" ▾"}
.orig p{margin:4px 0 0;font:italic 13px/1.5 var(--serif);color:var(--soft)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper);z-index:50;text-align:center;padding:24px}
#loading .bar{width:200px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* ---------- find ---------- */
.find-top{padding:16px 0 0}
.search{margin:16px 0 0;height:50px;border-radius:14px;background:var(--card);border:1.5px solid var(--accent);display:flex;align-items:center;padding:0 12px 0 14px;gap:10px;box-shadow:0 2px 10px rgba(28,56,104,.07)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:16px var(--ui);color:var(--ink);outline:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .x{width:22px;height:22px;border-radius:50%;background:#cfc7b6;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
#fchips{margin-top:12px}
.count{display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px var(--ui);color:var(--soft);margin:16px 0 8px}
.count b{color:var(--ink)}
.count button{color:var(--accent2);font-weight:600}
.res{overflow:hidden}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2);align-items:center;width:100%;text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:#fbf8f1}
.row.sel{background:#f1f6f4}
.row .nm{font:600 15.5px var(--serif)}
.row .yr{font:500 12.5px var(--ui);color:var(--soft);margin-left:5px;white-space:nowrap}
.row .ln{font-size:12.5px;color:var(--soft);margin:2px 0 5px;line-height:1.35}
.row .tags{display:flex;gap:4px;flex-wrap:wrap}
.row .chev{margin-left:auto;color:#c9c0ad;font-size:22px;padding-left:4px}
.nick{font:italic 500 13px var(--serif);color:var(--t-we)}
.more-btn{display:block;width:100%;padding:12px;text-align:center;font:600 13px var(--ui);color:var(--accent2);border-top:1px solid var(--line2)}
.surn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.surn button{display:flex;justify-content:space-between;align-items:baseline;padding:9px 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font:600 14px var(--serif)}
.surn button i{font:500 12px var(--ui);color:var(--faint);font-style:normal}
.srcs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.srcc{padding:10px;font-size:11.5px;color:var(--soft);line-height:1.35;text-decoration:none}
.srcc b{display:block;font:600 13px var(--serif);color:var(--ink);margin:6px 0 2px}
.srcc .bar{height:3px;border-radius:2px}
.faces{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.faces a{flex:none;width:78px;text-align:center;text-decoration:none;color:var(--ink);font:600 12px/1.25 var(--serif)}
.faces .av{width:64px;height:64px;margin:0 auto 6px}
.faces small{display:block;font:500 11px var(--ui);color:var(--soft)}

/* ---------- person ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;height:48px;position:sticky;top:0;z-index:5;background:rgba(250,247,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.bar .t{font:600 15px var(--ui);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:0;transition:opacity .2s;padding:0 8px}
.bar.scrolled .t{opacity:1}
.bar a,.bar button{display:flex;align-items:center;gap:4px;color:var(--accent);font:600 14px var(--ui);text-decoration:none;padding:6px 2px}
.bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph{display:flex;gap:14px;align-items:center;padding:4px 0 0}
.ph .av{width:68px;height:68px;border-width:3px;font-size:21px}
.ph .nick{display:block;font-size:14px;margin-top:1px}
.ph .d{font-size:13.5px;color:var(--soft);margin-top:4px;line-height:1.35}
.ph .d2{font:600 12.5px var(--ui);color:var(--accent2);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.flag{margin-top:12px;background:#fbf1de;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;color:#6e4a12;display:flex;gap:8px}
.ptabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line);position:sticky;top:calc(48px + env(safe-area-inset-top,0px));background:var(--paper);z-index:4}
.ptabs a{flex:1;text-align:center;padding:10px 0 11px;font:600 14px var(--ui);color:var(--faint);position:relative;text-decoration:none}
/* how are we related */
.relme{display:inline-block;margin-top:5px;font:600 12.5px var(--ui);color:var(--accent);background:rgba(28,56,104,.08);border-radius:999px;padding:3px 10px;text-decoration:none}
.rel-intro{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:var(--soft)}
.rel-s input{width:100%;box-sizing:border-box;font:15px var(--ui);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.rel-s input:focus{outline:2px solid var(--accent);outline-offset:1px}
#relhits .res{margin-top:8px}
.rel-chips{margin-top:10px;align-items:center;flex-wrap:wrap}
.rel-chips a.chip{text-decoration:none}
.rel-rl{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:0 2px 0 6px}
.rel-me{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font:600 12.5px var(--ui);color:var(--accent);cursor:pointer}
.rel-me[aria-pressed=true]{border-style:solid;background:rgba(28,56,104,.08)}
.rel-res{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent)}
.rel-t{font:600 21px var(--serif);color:var(--ink);line-height:1.25}
.rel-t:first-letter{text-transform:uppercase}
.rel-say{margin:6px 0 0;font-size:14px;line-height:1.55}
.rl{margin-top:6px}
.rl-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;position:relative;padding-bottom:14px}
.rl-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;padding-top:14px;border-top:2px solid var(--line)}
.rl-cols.one{grid-template-columns:1fr;border-top:0;padding-top:0}
.rl-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.rl-col>.card,.rl-col>.rl-m{position:relative}
.rl-col>*+*:before{content:"";position:absolute;left:26px;top:-14px;height:14px;border-left:2px solid var(--line)}
.rl-m{font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.035)}
.rl-more{margin-top:8px;padding:10px 12px}
.rl-more summary{cursor:pointer;font-weight:600;font-size:14px}
.rl-more summary:first-letter{text-transform:uppercase}
.ptabs a[aria-current=true]{color:var(--accent)}
.ptabs a[aria-current=true]:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.seg{display:flex;margin:14px 0 0;background:#ebe5d7;border-radius:10px;padding:3px}
.seg button{flex:1;text-align:center;font:600 13px var(--ui);padding:7px 0;border-radius:8px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* family */
.pr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 10px;display:flex;gap:9px;align-items:center;text-decoration:none;color:inherit;min-width:0}
.card .av{width:36px;height:36px;font-size:12px}
.card .nm{font:600 14px/1.2 var(--serif)}
.card .yr{font-size:12px;color:var(--soft);margin-top:2px}
.card.fa{border-left:4px solid var(--fa)}.card.mo{border-left:4px solid var(--mo)}
.card.gone{border-style:dashed;color:var(--faint);font-size:13px;justify-content:center;min-height:56px}
.card .more{margin-left:auto;color:#c9c0ad;font-size:18px}
.stem{height:16px;margin:0 auto;width:2px;background:#cbbfa6}
.focus{background:var(--accent);border-radius:16px;padding:12px;color:#fff;display:flex;gap:10px;flex-wrap:wrap}
.focus .me{flex:1 1 140px;display:flex;gap:9px;align-items:center;min-width:0}
.focus .sp{flex:1 1 140px;display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.1);border-radius:11px;padding:8px;color:#fff;text-decoration:none;min-width:0}
.focus .av{width:42px;height:42px;border-color:rgba(255,255,255,.75);box-shadow:none}
.focus .nm{font:600 14.5px/1.2 var(--serif)}
.focus .yr{font-size:12px;opacity:.8;margin-top:2px}
.mar{text-align:center;font-size:12.5px;color:var(--soft);padding:7px 4px 0}
.mar b{color:var(--ink);font-weight:600}
.sib{display:flex;gap:6px;flex-wrap:wrap}
.sib a{font:500 13px var(--ui);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:9px;text-decoration:none;color:var(--ink)}
.sib a i{font-style:normal;color:var(--faint);margin-left:3px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.with{font:600 12px var(--ui);color:var(--soft);margin:10px 0 6px}
.pg{overflow-x:auto;margin:14px -16px 0;padding:0 16px 8px;scroll-padding-inline:16px}
.pg-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:8px;min-width:590px}
.pg-col{display:flex;flex-direction:column}
.pg-h{font:700 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.pg-cards{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.pg-cards .card{padding:7px 8px}
.pg-cards .card .av{display:none}
.pg-cards .card.me{background:var(--accent);color:#fff;border-color:var(--accent)}
.pg-cards .card.me .yr{color:rgba(255,255,255,.8)}
.pg-slot{min-height:46px;border:1px dashed var(--line);border-radius:12px}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.desc{list-style:none;margin:12px 0 0;padding:0}
.desc ul{list-style:none;margin:4px 0 4px 14px;padding:0 0 0 10px;border-left:2px solid var(--line)}
.desc li{margin:4px 0}
.desc summary{list-style:none;display:flex;gap:8px;align-items:center}
.desc summary::-webkit-details-marker{display:none}
.desc .tw{width:18px;flex:none;color:var(--faint);font-size:12px;text-align:center}
.desc details[open]>summary .tw{transform:rotate(90deg)}
.desc .p{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.desc .p a{font:600 14.5px var(--serif);color:var(--ink);text-decoration:none}
.desc .p small{color:var(--soft);font-size:12px}

/* life */
.tl{position:relative;padding:4px 0 0}
.tl:before{content:"";position:absolute;left:47px;top:10px;bottom:0;width:2px;background:#ddd3bf}
.ev{display:flex;margin-bottom:10px;position:relative}
.ev .y{width:40px;flex:none;font:600 13px var(--serif);color:var(--accent);padding-top:10px;font-variant-numeric:tabular-nums}
.ev .y small{display:block;font:500 10.5px/1.2 var(--ui);color:var(--soft);margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:0}
.film{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--paper,#fbf9f4);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;color:inherit;font:inherit;margin-top:6px}
.film .fth{position:relative;flex:none;width:132px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#222}
.film .fth img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.2)}
.film .fth i{position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.film .fth i:after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.film b{display:block;font-size:14px;line-height:1.3;color:var(--ink)}
.film span{display:block;font-size:12px;line-height:1.4;color:var(--soft);margin-top:3px}
.filmbox{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}

  // ---------------- PLAN VIEWER (pan / pinch / wheel zoom over the 1869 plan) ----------------
  function planView(el, { sel = null, onPick } = {}) {
    const W = D.OV.w, Hh = D.OV.h;
    el.innerHTML = `<div class="pv-in" style="width:${W}px;height:${Hh}px"><img src="roseln1869.png" width="${W}" height="${Hh}" alt="Der Dorfplan von Roseln, 1869" draggable="false">${Object.keys(H).filter(h => D.HPX[h]).map(h => `<button type="button" class="pv-d${h === sel ? ' sel' : ''}" data-h="${esc(h)}" style="left:${D.HPX[h][0]}px;top:${D.HPX[h][1]}px" aria-label="${esc(houseName(h))}"></button>`).join('')}</div>
      <div class="pv-zoom"><button type="button" data-z="1" aria-label="Vergrößern">+</button><button type="button" data-z="-1" aria-label="Verkleinern">−</button></div>`;
    const inner = el.querySelector('.pv-in');
    let s = .6, tx = 0, ty = 0;
    const cw = () => el.clientWidth, ch = () => el.clientHeight, minS = () => Math.min(cw() / W, ch() / Hh) * .9;
    function apply() {
      s = Math.min(Math.max(s, minS()), 3);
      const w = W * s, h = Hh * s, m = 60;
      tx = w + 2 * m < cw() ? (cw() - w) / 2 : Math.min(m, Math.max(cw() - w - m, tx));
      ty = h + 2 * m < ch() ? (ch() - h) / 2 : Math.min(m, Math.max(ch() - h - m, ty));
      inner.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; inner.style.setProperty('--k', 1 / s);
    }
    function zoomAt(f, cx, cy) { const ns = Math.min(Math.max(s * f, minS()), 3); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }
    function centre(h, ns) { const P = h ? D.HPX[h] : [W * .5, Hh * .56]; s = ns || s; tx = cw() / 2 - P[0] * s; ty = ch() * (h ? .4 : .5) - P[1] * s; apply(); }
    function select(h) { el.querySelectorAll('.pv-d.sel').forEach(d => d.classList.remove('sel')); if (h) { const d = el.querySelector(`.pv-d[data-h="${CSS.escape(h)}"]`); if (d) d.classList.add('sel'); } }
    const pts = new Map(); let moved = 0, last = null, pinch = null;
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.pv-zoom')) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]); moved = pts.size > 1 ? 99 : 0; last = [e.clientX, e.clientY];
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s }; }
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
      const r = el.getBoundingClientRect();
      if (pts.size === 1) { const dx = e.clientX - last[0], dy = e.clientY - last[1]; moved += Math.abs(dx) + Math.abs(dy); tx += dx; ty += dy; last = [e.clientX, e.clientY]; apply(); }
      else if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(pinch.s * d / pinch.d / s, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); }
    });
    const up = e => {
      if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
      if (pts.size === 1) last = [...pts.values()][0];
      if (!pts.size && moved < 8) { // the nearest house dot within reach of the finger
        let best = null, bd = 26;
        el.querySelectorAll('.pv-d').forEach(d => { const r = d.getBoundingClientRect(), dd = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY); if (dd < bd) { bd = dd; best = d; } });
        if (best) { select(best.dataset.h); onPick && onPick(best.dataset.h); }
      }
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); const r = el.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    el.addEventListener('click', e => { const z = e.target.closest('[data-z]'); if (z) zoomAt(+z.dataset.z > 0 ? 1.4 : 1 / 1.4, cw() / 2, ch() / 2); });
    el.addEventListener('keydown', e => { const d = e.target.closest('.pv-d'); if (d && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(d.dataset.h); onPick && onPick(d.dataset.h); } });
    new ResizeObserver(() => apply()).observe(el);
    return { centre, select };
  }

    const v = e.target.closest('[data-vm]'); if (v) { renderVillage(v.dataset.vm); return; }
    const en = e.target.closest('[data-enlarge]'); if (en) { enlarge(en.dataset.enlarge); return; }
    const ph = e.target.closest('[data-ph]'); if (ph) { e.preventDefault(); const ctx = ph.closest('[data-phset]'); openPhoto(ph.dataset.ph, ctx ? ctx.dataset.phset.split(',') : null); return; }
    const gfb = e.target.closest('[data-gf]'); if (gfb) { ST.gf = gfb.dataset.gf; $('#galbox').innerHTML = gallery(); return; }
    const pl = e.target.closest('[data-phl]'); if (pl) { const l = PHBY.get(+pl.dataset.phl) || []; if (l.length) openPhoto(l[0], l); return; }
    const hl = e.target.closest('[data-hsl]'); if (hl) { const l = HSBY.get(+hl.dataset.hsl) || []; if (l.length) openPhoto(l[0], l); return; }
  });
  window.addEventListener('scroll', () => { const b = $('#pbar'); if (b) b.classList.toggle('scrolled', window.scrollY > 90); }, { passive: true });
  $('#main').addEventListener('scroll', () => { const b = $('#pbar'); if (b) b.classList.toggle('scrolled', $('#main').scrollTop > 90); }, { passive: true });

  // ---------------- boot ----------------
  (async function boot() {
    const prog = [0, 0], upd = () => { $('#ldbar').style.width = Math.round((prog[0] * .4 + prog[1] * .6) * 100) + '%'; };
    try {
      [D, O] = await Promise.all([getJSON('data/people.json', x => { prog[0] = x; upd(); }), getJSON('data/records_de.json', x => { prog[1] = x; upd(); $('#ldtxt').textContent = 'Die Kirchenbucheinträge werden geladen'; })]);
      applyDE(await getJSON('data/de.json', () => { }));
    } catch (err) {
      $('#ldtxt').innerHTML = 'Die Datendateien konnten nicht geladen werden. Wenn Sie die Seite direkt vom Computer geöffnet haben, öffnen Sie sie stattdessen über die Website (oder einen lokalen Webserver).'; return;
    }
    prep(); buildIndex(); renderFindShell(); renderResults();
    $('#welcome').innerHTML = `<div style="padding:60px 10px 0;max-width:520px"><div class="eyebrow">Roseln Dorf</div><h1>Links eine Person wählen</h1><p class="sub">Suchen Sie nach Name, Spitzname oder Familiennummer, oder blättern Sie nach Nachnamen. Jede Personenseite vereint das Roselner und das Magareier Kirchenbuch und Christian Weiss’ Dorfgeschichte.</p><div class="acts"><a class="btn" href="#village">Das Dorf</a><a class="btn" href="#books">Über die Bücher</a></div></div>`;
    window.addEventListener('hashchange', route);
    route();
    $('#loading').hidden = true;
  })();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
})();
</script>
</body>
</html>
